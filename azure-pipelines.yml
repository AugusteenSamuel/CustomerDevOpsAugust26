trigger:
- master
 
pool:
  vmImage: ubuntu-latest
 
stages:
 
- stage: Build
  jobs:
  - job: BuildJob
 
    steps:
    - script: echo "Building Application"
 
- stage: Deploy_Dev
  dependsOn: Build
 
  jobs:
  - job: DeployDev
 
    steps:
    - script: echo "Deploying to Dev"
 
- stage: Deploy_QA
  dependsOn: Deploy_Dev
 
  jobs:
  - job: DeployQA
 
    steps:
    - script: echo "Deploying to QA"
 
- stage: Deploy_Prod
  dependsOn: Deploy_QA
 
  jobs:
  - job: DeployProd
 
    steps:
    - script: echo "Deploying to Prod"